<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WaifuForge - AI-powered character generation">
    <title>WaifuForge</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Welcome to WaifuForge</h1>
        <p>Craft your dream characters with AI</p>
    </header>
    <main>
        <section class="generator-section">
            <button id="generateBtn" class="generate-button">
                <span class="button-text">Generate Character</span>
                <span class="loading-spinner hidden"></span>
            </button>
            <div id="result" class="result-text"></div>
            <div id="face_result" class="face-container"></div>
            <div id="error-message" class="error-message hidden"></div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025. Ashish Raj.</p>
    </footer>

    <script>
        const generateBtn = document.getElementById('generateBtn');
        const resultText = document.getElementById('result');
        const faceResult = document.getElementById('face_result');
        const errorMessage = document.getElementById('error-message');
        const loadingSpinner = document.querySelector('.loading-spinner');
        const buttonText = document.querySelector('.button-text');

        async function generateCharacter() {
            try {
                // Show loading state
                generateBtn.disabled = true;
                buttonText.textContent = 'Generating...';
                loadingSpinner.classList.remove('hidden');
                resultText.textContent = '';
                faceResult.innerHTML = '';
                errorMessage.classList.add('hidden');

                const response = await fetch('http://localhost:5000/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({})
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.message || 'Server error');
                }

                if (data.status === 'success' && data.face) {
                    // Display name
                    resultText.textContent = data.name;
                    
                    // Display image
                    const img = new Image();
                    img.onload = () => {
                        faceResult.innerHTML = '';
                        faceResult.appendChild(img);
                    };
                    img.onerror = () => {
                        throw new Error('Failed to load generated image');
                    };
                    img.src = `data:image/png;base64,${data.face}`;
                    img.alt = 'Generated character';
                    img.className = 'generated-image';
                } else {
                    throw new Error('Invalid response format');
                }
            } catch (error) {
                console.error('Error:', error);
                errorMessage.textContent = `Error: ${error.message}`;
                errorMessage.classList.remove('hidden');
                resultText.textContent = '';
                faceResult.innerHTML = '';
            } finally {
                // Reset button state
                generateBtn.disabled = false;
                buttonText.textContent = 'Generate Character';
                loadingSpinner.classList.add('hidden');
            }
        }

        generateBtn.addEventListener('click', generateCharacter);
    </script>
</body>
</html>

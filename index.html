<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WaifuForge - AI-powered character generation">
    <title>WaifuForge</title>
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Rajdhani:wght@400;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <h1>Welcome to WaifuForge</h1>
        <p>Craft your dream characters with AI</p>
    </header>
    <main>
        <section class="generator-section">
            <button id="generateBtn" class="generate-button">
                <span class="button-text">Generate Character</span>
                <span class="loading-spinner hidden"></span>
            </button>
            <div id="result" class="result-text"></div>
            <div id="face_result" class="face-container"></div>
            <div id="error-message" class="error-message hidden"></div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025. Ashish Raj.</p>
    </footer>

    <script>

        const generateBtn = document.getElementById('generateBtn');
        const buttonText = generateBtn.querySelector('.button-text');
        const loadingSpinner = generateBtn.querySelector('.loading-spinner');
        const resultText = document.getElementById('result');
        const faceResult = document.getElementById('face_result');
        const errorMessage = document.getElementById('error-message');

        async function generateCharacter() {
            try {

                generateBtn.disabled = true;
                buttonText.textContent = 'Generating...';
                loadingSpinner.classList.remove('hidden');
                resultText.textContent = '';
                faceResult.innerHTML = '';
                errorMessage.classList.add('hidden');

                const response = await fetch('http://localhost:5000/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({})
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Server error');
                }

                if (data.status === 'success') {

                    resultText.textContent = data.name;


                    if (data.face) {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');


                        canvas.width = data.face[0].length;
                        canvas.height = data.face.length;


                        const imageData = ctx.createImageData(canvas.width, canvas.height);


                        for (let i = 0; i < data.face.length; i++) {
                            for (let j = 0; j < data.face[0].length; j++) {
                                const pixelIndex = (i * canvas.width + j) * 4;
                                for (let c = 0; c < 3; c++) {
                                    imageData.data[pixelIndex + c] = data.face[i][j][c];
                                }
                                imageData.data[pixelIndex + 3] = 255;
                            }
                        }


                        ctx.putImageData(imageData, 0, 0);


                        faceResult.innerHTML = '';
                        faceResult.appendChild(canvas);


                        const dimensions = document.createElement('p');
                        <!-- dimensions.textContent = `Image size: ${canvas.width}x${canvas.height}`; -->
                        dimensions.className = 'image-dimensions';
                        faceResult.appendChild(dimensions);
                    }
                } else {
                    throw new Error('Invalid response format');
                }
            } catch (error) {
                console.error('Error:', error);
                errorMessage.textContent = `Error: ${error.message}`;
                errorMessage.classList.remove('hidden');
                resultText.textContent = '';
                faceResult.innerHTML = '';
            } finally {

                generateBtn.disabled = false;
                buttonText.textContent = 'Generate Character';
                loadingSpinner.classList.add('hidden');
            }
        }

        generateBtn.addEventListener('click', generateCharacter);
    </script>
</body>

</html>
